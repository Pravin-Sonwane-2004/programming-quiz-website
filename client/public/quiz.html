<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="quiz.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Tabler Icons CDN -->
    <link href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <style>
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-links li {
            margin-left: 20px;
        }
        #menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
            }
            .nav-links.active {
                display: flex;
            }
            .navbar .container {
                flex-direction: column;
                align-items: flex-start;
            }
            #menu-toggle {
                display: block;
            }
            #dark-mode-toggle {
                margin-top: 10px;
            }
        }
        html {
            scroll-behavior: smooth;
        }
        .progress-bar-container {
            width: 80%;
            background-color: #ddd;
            border-radius: 10px;
            height: 20px;
            margin: 20px auto;
            overflow: hidden;
        }
    </style>
</head>
<body class="dark-mode">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">CodingNinja</a>
            <span id="menu-toggle">&#9776;</span>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
            <button id="dark-mode-toggle" type="button">Toggle Dark Mode</button>
        </div>
    </nav>

    <!-- Main Quiz Section -->
    <div id="main-content">
        <!-- Quiz Container -->
        <div class="quiz-container scrollable-content">
            <h2 class="quiz-title">Programming Quiz</h2>
            <h3 class="quiz-intro" id="intro-heading">By Vishal Giri</h3>
            <p class="quiz-intro" id="intro-text">Which programming language would you like to quiz on?</p>
            <div id="language-buttons" class="quiz-buttons">
                <button class="quiz-button" onclick="startQuiz('Java')">Java</button>
                <button class="quiz-button" onclick="startQuiz('C')">C</button>
                <button class="quiz-button" onclick="startQuiz('C++')">C++</button>
                <button class="quiz-button" onclick="startQuiz('Python')">Python</button>
                <button class="quiz-button" onclick="startQuiz('DSA')">DSA</button>
                <button class="quiz-button" onclick="startQuiz('SQL')">SQL</button>
                <button class="quiz-button" onclick="startQuiz('javascript')">JavaScript</button>
                <button class="quiz-button" onclick="startQuiz('CSS')">CSS</button>
                <button class="quiz-button" onclick="startQuiz('RandomTechnical')">Random Technical</button>
            </div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection"></div>

        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Performance Section -->
        <div id="performanceSection" class="performance-container" style="display: none;"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="social-icons" style="margin-bottom:10px; text-align:center;">
                <a href="https://portfolio-react-app-rho.vercel.app/" target="_blank"><i class="bx bxs-user"></i></a>
                <a href="https://www.instagram.com/its.Vishal.2004" target="_blank"><i class="bx bxl-instagram"></i></a>
                <a href="https://www.youtube.com/@ProgrammingWithVishal" target="_blank"><i class="bx bxl-youtube"></i></a>
                <a href="https://www.linkedin.com/in/Vishal-sonwane-079a621ba/" target="_blank"><i class="bx bxl-linkedin"></i></a>
                <a href="https://github.com/Vishal-Sonwane-2004" target="_blank"><i class="bx bxl-github"></i></a>
                <a href="https://buymeacoffee.com/devVishal" target="_blank" title="Buy me a coffee"><i class="ti ti-coffee"></i></a>
            </div>
            <p>&copy; 2024 Hello Coderz. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts: shared logic (dark mode, menu, quiz) -->
    <script src="scripts.js"></script>
</body>
</html>
