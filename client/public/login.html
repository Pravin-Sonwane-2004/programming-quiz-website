<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <!-- Tabler Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.43.0/tabler-icons.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Logo and Header -->
        <h2 class="logo">
            <img src="imagee.png" alt="Logo" class="logo-image"> Hello Coderz
        </h2>
        <div id="success-message" style="color: green; display: none; text-align: center; margin-bottom: 20px;"></div>

        <!-- Login Form -->
        <div class="logreg-box">
            <div class="form-box login">
                <form novalidate id="loginForm">
                    <h2>Log In</h2>

                    <!-- Error Message -->
                    <div id="error-message" role="alert" style="color: red; display: none;"></div>

                    <!-- Email Input -->
                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-envelope"></i></span>
                        <input type="email" name="email" id="email" required placeholder="Enter your email" autocomplete="email">
                        <label for="email">Email</label>
                    </div>

                    <!-- Password Input -->
                    <div class="input-box">
                        <span class="icon" onclick="togglePasswordVisibility()">
                            <i class="bx bxs-lock-alt" id="lockIcon" aria-label="Toggle password visibility" role="button" tabindex="0"></i>
                        </span>
                        <input type="password" name="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
                        <label for="password">Password</label>
                    </div>

                    <!-- Remember Me and Forgot Password -->
                    <div class="remember-forget">
                        <label><input type="checkbox" name="remember"> Remember me</label>
                        <a href="forget.html">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn" id="submit-btn">Log In</button>

                    <!-- Sign Up Redirect -->
                    <div class="login-register">
                        Don't have an account? <a href="register.html" class="register-link">Sign Up</a>
                    </div>
                </form>
            </div>
        </div>
<!-- Social Media Links -->
        <div class="social-icons">
            <a href="https://portfolio-react-app-rho.vercel.app/" target="_blank"><i class="bx bxs-user"></i></a>
            <a href="https://www.instagram.com/its.Vishal.2004" target="_blank"><i class="bx bxl-instagram"></i></a>
            <a href="https://www.youtube.com/@ProgrammingWithVishal" target="_blank"><i class="bx bxl-youtube"></i></a>
            <a href="https://www.linkedin.com/in/Vishal-sonwane-079a621ba/" target="_blank"><i class="bx bxl-linkedin"></i></a>
            <a href="https://buymeacoffee.com/devVishal" target="_blank" title="Buy me a coffee"><i class="ti ti-coffee" style="font-size:1.5em;"></i></a>
        </div>
    </div>

    <script>
        // Success message from the register flow (?message=...)
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get('message');
        if (message) {
            const messageContainer = document.getElementById('success-message');
            messageContainer.textContent = message;
            messageContainer.style.display = 'block';
        }

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const lockIcon = document.getElementById('lockIcon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                lockIcon.classList.replace('bxs-lock-alt', 'bxs-lock-open-alt');
            } else {
                passwordField.type = 'password';
                lockIcon.classList.replace('bxs-lock-open-alt', 'bxs-lock-alt');
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(text) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = text;
            errorMessage.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.querySelector('[name="remember"]').checked;
            const submitBtn = document.getElementById('submit-btn');

            document.getElementById('error-message').style.display = 'none';

            if (!validateEmail(email)) {
                showError('Please enter a valid email address.');
                return;
            }
            if (!password) {
                showError('Please enter your password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, remember: remember })
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data: data })))
                .then(({ ok, data }) => {
                    if (ok) {
                        window.location.href = '/index.html';
                    } else {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Log In';
                        showError(data.message || 'Login failed. Please try again.');
                    }
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Log In';
                    showError('Unable to reach the server. Please try again later.');
                });
        });
    </script>
</body>

</html>
