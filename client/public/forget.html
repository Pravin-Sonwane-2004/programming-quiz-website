<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="forget.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Tabler Icons CDN -->
    <link href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Logo and Header -->
        <h2 class="logo">
            <img src="imagee.png" alt="Logo" class="logo-image"> Hello Coderz
        </h2>

        <!-- Step 1: Request a reset link (no token in URL yet) -->
        <div class="form-box" id="request-step">
            <form novalidate id="requestForm">
                <h2>Forgot Password</h2>
                <p style="margin-bottom: 10px;">Enter your email address and we will generate a reset link.</p>

                <div class="input-box">
                    <span class="icon"><i class="bx bxs-envelope"></i></span>
                    <input type="email" name="email" id="email" required aria-label="Email Address" placeholder="Enter your email" autocomplete="email">
                    <label for="email">Email Address</label>
                </div>

                <div id="request-message" role="alert" style="margin: 10px 0; font-size: 0.95em;"></div>

                <button type="submit" class="btn" id="request-btn">Send Reset Link</button>

                <div class="login-register">
                    Remember your password? <a href="login.html" class="register-link">Log In</a>
                </div>
            </form>
        </div>

        <!-- Step 2: Enter a new password (token present in the URL) -->
        <div class="form-box" id="reset-step" style="display: none;">
            <form novalidate id="resetForm">
                <h2>Reset Password</h2>

                <div class="input-box">
                    <span class="icon"><i class="bx bxs-lock-alt"></i></span>
                    <input type="password" name="newpassword" id="newpassword" required aria-label="New Password" placeholder="Enter new password" autocomplete="new-password" oninput="checkPasswordStrength()">
                    <label for="newpassword">New Password</label>
                    <div id="password-strength" style="margin-top:5px;font-size:0.95em;"></div>
                </div>

                <div class="input-box">
                    <span class="icon"><i class="bx bxs-lock-alt"></i></span>
                    <input type="password" name="confirmpassword" id="confirmpassword" required aria-label="Confirm Password" placeholder="Confirm your password" autocomplete="new-password">
                    <label for="confirmpassword">Confirm Password</label>
                </div>

                <div id="reset-message" role="alert" style="margin: 10px 0; font-size: 0.95em;"></div>

                <button type="submit" class="btn" id="reset-btn">Change Password</button>

                <div class="login-register">
                    Remember your password? <a href="login.html" class="register-link">Log In</a>
                </div>
            </form>
        </div>
    </div>
<script>
        // Show either step depending on whether a reset token is present.
        const token = new URLSearchParams(window.location.search).get('token');
        const requestStep = document.getElementById('request-step');
        const resetStep = document.getElementById('reset-step');

        if (token) {
            requestStep.style.display = 'none';
            resetStep.style.display = 'block';
        }

        function showMessage(id, text, color) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.color = color || 'red';
        }

        function checkPasswordStrength() {
            const pwd = document.getElementById('newpassword').value;
            const strengthDiv = document.getElementById('password-strength');
            let strength = 0;
            if (pwd.length >= 8) strength++;
            if (/[A-Z]/.test(pwd)) strength++;
            if (/[a-z]/.test(pwd)) strength++;
            if (/[0-9]/.test(pwd)) strength++;
            if (/[^A-Za-z0-9]/.test(pwd)) strength++;

            let msg = '';
            let color = '';
            if (pwd.length === 0) {
                msg = '';
            } else if (strength <= 2) {
                msg = 'Weak';
                color = 'red';
            } else if (strength === 3) {
                msg = 'Medium';
                color = 'orange';
            } else {
                msg = 'Strong';
                color = 'green';
            }
            strengthDiv.textContent = msg;
            strengthDiv.style.color = color;
        }

        // Step 1: request a reset link
        document.getElementById('requestForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('request-btn');

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showMessage('request-message', 'Please enter a valid email address.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            fetch('/forgot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data: data })))
                .then(({ ok, data }) => {
                    btn.disabled = false;
                    btn.textContent = 'Send Reset Link';
                    if (!ok) {
                        showMessage('request-message', data.message || 'Something went wrong.');
                        return;
                    }
                    const messageEl = document.getElementById('request-message');
                    messageEl.style.color = 'green';
                    messageEl.innerHTML = data.resetLink
                        ? 'Reset link generated. Click below to reset your password:<br><a href="' + data.resetLink + '">' + data.resetLink + '</a>'
                        : data.message;
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.textContent = 'Send Reset Link';
                    showMessage('request-message', 'Unable to reach the server. Please try again later.');
                });
        });

        // Step 2: submit the new password with the token
        document.getElementById('resetForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const newPassword = document.getElementById('newpassword').value;
            const confirmPassword = document.getElementById('confirmpassword').value;
            const btn = document.getElementById('reset-btn');

            if (newPassword.length < 8 || !/[a-zA-Z]/.test(newPassword) || !/\d/.test(newPassword)) {
                showMessage('reset-message', 'Password must be at least 8 characters and include a letter and a number.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('reset-message', 'Passwords do not match!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            fetch('/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, newPassword: newPassword })
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data: data })))
                .then(({ ok, data }) => {
                    btn.disabled = false;
                    btn.textContent = 'Change Password';
                    if (ok) {
                        showMessage('reset-message', 'Password has been reset. Redirecting to login...', 'green');
                        setTimeout(() => { window.location.href = '/login.html?message=' + encodeURIComponent(data.message || 'Password changed successfully!'); }, 1500);
                    } else {
                        showMessage('reset-message', data.message || 'Unable to reset your password.');
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.textContent = 'Change Password';
                    showMessage('reset-message', 'Unable to reach the server. Please try again later.');
                });
        });
    </script>
</body>

</html>
