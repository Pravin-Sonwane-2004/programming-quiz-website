<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <!-- Boxicons CSS for social media icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <!-- Tabler Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.43.0/tabler-icons.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Register Header -->
        <h2 class="logo">
            <img src="imagee.png" alt="Logo" class="logo-image"> Hello Coderz
        </h2>

        <!-- Register Form -->
        <div class="logreg-box">
            <div class="form-box register">
                <form novalidate id="registerForm">
                    <h2>Sign Up</h2>

                    <!-- Error Message Display -->
                    <div id="error-message" role="alert" style="color: red; display: none;"></div>

                    <!-- Name Input -->
                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-user"></i></span>
                        <input type="text" name="username" id="name" required placeholder="Enter your name" autocomplete="name">
                        <label for="name">Name</label>
                    </div>

                    <!-- Email Input -->
                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-envelope"></i></span>
                        <input type="email" name="email" id="email" required placeholder="Enter your email" autocomplete="email">
                        <label for="email">Email</label>
                    </div>

                    <!-- Password Input with Toggle Visibility -->
                    <div class="input-box">
                        <span class="icon" onclick="togglePasswordVisibility('password', 'lockIcon')">
                            <i class="bx bxs-lock-alt" id="lockIcon" aria-label="Toggle password visibility" role="button" tabindex="0"></i>
                        </span>
                        <input type="password" name="password" id="password" required placeholder="Enter your password" autocomplete="new-password">
                        <label for="password">Password</label>
                    </div>

                    <!-- Confirm Password Input -->
                    <div class="input-box">
                        <span class="icon" onclick="togglePasswordVisibility('confirmPassword', 'confirmLockIcon')">
                            <i class="bx bxs-lock-alt" id="confirmLockIcon" aria-label="Toggle confirm password visibility" role="button" tabindex="0"></i>
                        </span>
                        <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="Confirm your password" autocomplete="new-password">
                        <label for="confirmPassword">Confirm Password</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn" id="submit-btn">Sign Up</button>

                    <div class="login-register">
                        Already have an account? <a href="login.html" class="register-link">Log In</a>
                    </div>
                </form>
            </div>
        </div>
<!-- Social Media Links -->
        <div class="social-icons">
            <a href="https://portfolio-react-app-rho.vercel.app/" target="_blank"><i class="bx bxs-user"></i></a>
            <a href="https://www.instagram.com/its.Vishal.2004" target="_blank"><i class="bx bxl-instagram"></i></a>
            <a href="https://www.youtube.com/@ProgrammingWithVishal" target="_blank"><i class="bx bxl-youtube"></i></a>
            <a href="https://www.linkedin.com/in/Vishal-sonwane-079a621ba/" target="_blank"><i class="bx bxl-linkedin"></i></a>
            <a href="https://buymeacoffee.com/devVishal" target="_blank" title="Buy me a coffee"><i class="ti ti-coffee" style="font-size:1.5em;"></i></a>
        </div>
    </div>

    <!-- Script for Toggle Password Visibility and Validation -->
    <script>
        function togglePasswordVisibility(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('bxs-lock-alt', 'bxs-lock-open-alt');
            } else {
                field.type = 'password';
                icon.classList.replace('bxs-lock-open-alt', 'bxs-lock-alt');
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(text) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = text;
            errorMessage.style.display = 'block';
        }

        // Client side validation + submit via the JSON API
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submit-btn');

            document.getElementById('error-message').style.display = 'none';

            if (name.length < 3) {
                showError('Name must be at least 3 characters long.');
                return;
            }
            if (!validateEmail(email)) {
                showError('Please enter a valid email address.');
                return;
            }
            if (password.length < 8 || !/[a-zA-Z]/.test(password) || !/\d/.test(password)) {
                showError('Password must be at least 8 characters and include a letter and a number.');
                return;
            }
            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name, email: email, password: password })
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data: data })))
                .then(({ ok, data }) => {
                    if (ok) {
                        window.location.href = '/login.html?message=' + encodeURIComponent(data.message || 'You have registered successfully!');
                    } else {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign Up';
                        showError(data.message || 'Registration failed. Please try again.');
                    }
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';
                    showError('Unable to reach the server. Please try again later.');
                });
        });
    </script>
</body>

</html>
